    <!--
      The structured data of the home page.

      It is in the static document on purpose: a crawler that does not run
      JavaScript still has to find the WebSite schema, because that schema is
      what decides the name the site is listed under in a search result.

      `data-app-jsonld` marks these blocks as the application's own. The
      client replaces every block carrying that attribute when the route
      changes, so the document never ends up holding two WebSite schemas that
      could disagree about the name. The content below is the same as what
      the client publishes — `tests/seo.test.ts` fails if the two drift.
    -->
    <script type="application/ld+json" data-app-jsonld="true">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CareerDev4AI",
        "alternateName": ["CareerDev4AI", "Career Dev 4AI", "CareerDev4AI Career Platform"],
        "url": "https://careerdev4ai.pages.dev/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://careerdev4ai.pages.dev/brand/icon-512.png"
        },
        "image": "https://careerdev4ai.pages.dev/brand/og-image-1200x630.png",
        "description": "CareerDev4AI is an AI-powered career development platform for students and young professionals: goals, skills, roadmaps, CVs, job applications and interview practice in one workspace."
      }
    </script>
    <script type="application/ld+json" data-app-jsonld="true">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CareerDev4AI",

        "url": "https://careerdev4ai.pages.dev/",

        }

    </script>
    <script type="application/ld+json" data-app-jsonld="true">
