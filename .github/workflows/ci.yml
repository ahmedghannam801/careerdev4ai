name: CI

on:
  push:
    branches: [main, master, 'audit/**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: Run against the dedicated, exclusive, non-production Supabase test project
        type: boolean
        required: true
        default: false

# GITHUB_TOKEN is read-only; no job in this workflow needs write access.
permissions:
  contents: read

# The integration suite shares tables in its designated Supabase test project.
# A single constant serializes this workflow across branches and PRs.
concurrency:
  group: roadmapak-ci-global
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm run test:run

      - name: Database-free test suite
        run: npm run test:logic

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e

      - name: Setup Python (actions/setup-python v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Semgrep security scan (pinned)
        run: |
          python -m pip install --disable-pip-version-check 'semgrep==1.185.0'
          semgrep scan --config .semgrep.yml --error

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Integration tests are not automatic
        if: github.event_name != 'workflow_dispatch' || inputs.run_integration_tests != true
        run: |
          echo '::notice::Integration tests were NOT run. They are manual opt-in only because the suite shares mutable Supabase test resources.'
          echo '### Supabase integration tests: not run' >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual opt-in is available only after configuring and verifying a dedicated, exclusive, non-production Supabase test project.' >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: Supabase integration tests (manual opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration_tests == true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required test-project secrets
        id: credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
          SUPABASE_TEST_PROJECT_EXCLUSIVE: ${{ secrets.SUPABASE_TEST_PROJECT_EXCLUSIVE }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_TEST_PROJECT_REF SUPABASE_TEST_PROJECT_EXCLUSIVE; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Supabase integration tests were NOT run: required dedicated test-project secrets are missing.'
            printf '### Supabase integration tests: not run\nMissing secret names (values never displayed): `%s`\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (actions/checkout v4.2.2)
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node (actions/setup-node v4.4.0)
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      - name: Run integration tests against the validated test project
        if: steps.credentials.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
          SUPABASE_TEST_PROJECT_EXCLUSIVE: ${{ secrets.SUPABASE_TEST_PROJECT_EXCLUSIVE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run test:integration

      - name: Report skipped integration tests
        if: steps.credentials.outputs.available != 'true'
        run: echo 'Integration tests were skipped, not passed; see the notice and job summary above.'
