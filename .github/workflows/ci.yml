name: CI

on:
  push:
    branches: [main, master, 'audit/**']
  pull_request:

# One run at a time.
#
# The suite runs against the shared Supabase project, and the tables it writes
# to — announcements, the delivery ledger, the scheduler and the rate limits —
# are the same ones for every run. Two runs that overlap disturb each other
# there, and the second one fails for reasons that have nothing to do with the
# commit under test. That is what made four consecutive pushes red.
#
# `cancel-in-progress: false` queues a run instead of starting it alongside the
# previous one, so a run never leaves half its work behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The suite creates and deletes only its own `cp-test-*` identities and
      # rows. The credentials come from repository secrets; if they are not
      # configured the run fails with a clear message rather than skipping.
      - name: Test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high
